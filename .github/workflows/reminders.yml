name: Deadline reminders

# Free hosting (Render free) puts the API to sleep when idle, so its own 08:00 job can be
# missed. This calls the API every morning instead. Needs the CRON_SECRET secret (the same
# value as the API's CRON_SECRET) and the API_URL variable; it does nothing until both exist.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 08:00 in Pakistan
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Run the reminder job
        if: env.CRON_SECRET != '' && env.API_URL != ''
        # A sleeping free instance can take a minute to wake, hence the retries.
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$API_URL/cron/reminders"
