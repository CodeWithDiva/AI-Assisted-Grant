name: Deploy

# Runs after CI succeeds on main. Each step is skipped until its secrets are added under
# Settings → Secrets and variables → Actions, so this workflow is safe to merge early.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy the API (Render)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL&ref=${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Wait for the new API to report healthy
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.API_URL != ''
        run: |
          expected=$(node -p "require('./apps/api/package.json').version")
          for attempt in $(seq 1 60); do
            body=$(curl --silent "$API_URL/health" || true)
            if echo "$body" | grep -q "\"database\":\"up\"" && echo "$body" | grep -q "\"version\":\"$expected\""; then
              echo "API $expected is healthy"; exit 0
            fi
            sleep 15
          done
          echo "API did not become healthy on version $expected: $body"; exit 1

      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm

      - name: Deploy the web app (Vercel)
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Nothing configured
        if: env.RENDER_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN == ''
        run: echo "::notice::No deploy secrets are set yet — see docs/DEPLOYMENT.md, section 7."
